<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Belly Dance Show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="light light1"></div>
    <div class="light light2"></div>
 
    <span class="star star1">✦</span>
    <span class="star star2">✦</span>
    <span class="star star3">✦</span>
    <span class="star star4">✦</span>
 
    <img class="dancer dancer1" src="dancer1.svg" alt="Dancer 1">
    <img class="dancer dancer2" src="dancer2.svg" alt="Dancer 2">
 
    <div class="floor"></div>
 
    <div class="rain">
      <div class="money"></div>
      <div class="money"></div>
      <div class="money"></div>
      <div class="money"></div>
      <div class="money"></div>
      <div class="money"></div>
    </div>
 
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
 
    <div class="audience">
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
      </div>
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
      </div>
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
      </div>
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="person">
        <div class="arm"><div class="bill"></div></div>
        <div class="head"></div>
        <div class="body"></div>
      </div>
    </div>
 
    <button class="start" onclick="startShow()">Start the Show</button>
  </div>
 
  <audio id="music" src="music.mp3" loop></audio>
 
  <script src="script.js"></script>
</body>
</html>
